<header class="site-header">
  <div class="container">
    <nav class="navbar">
      <a class="navbar-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link {% if page.url == '/' %}active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if page.url contains '/journal/' %}active{% endif %}" href="{{ '/journal/' | relative_url }}">Journal</a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-portfolio" href="{{ site.portfolio_url }}">Portfolio&nbsp;↗</a>
        </li>
      </ul>
    </nav>
  </div>
</header>
